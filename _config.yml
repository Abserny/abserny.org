title: Abserny Docs
description: Technical documentation for the Abserny voice-first AI vision assistant.
baseurl: "/abserny.org"
url: "https://abserny.github.io"

# Build settings
markdown: kramdown
theme: null

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

# Permalink style
permalink: pretty

# Collections
collections:
  updates:
    output: true
    permalink: /updates/:name/
  docs:
    output: true
    permalink: /docs/:name/

# Defaults
defaults:
  - scope:
      path: "docs"
      type: "docs"
    values:
      layout: doc
  - scope:
      path: "updates"
      type: "updates"
    values:
      layout: default
  - scope:
      path: ""
    values:
      layout: default

include:
  - assets/css/_tokens.css
  - assets/css/_reset.css
  - assets/css/_nav.css
  - assets/css/_layout.css
  - assets/css/_typography.css
  - assets/css/_components.css
  - assets/css/_responsive.css
